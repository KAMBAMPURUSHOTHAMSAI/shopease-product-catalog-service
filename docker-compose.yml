services:
  catalog-db:
    image: mysql:8.4
    container_name: shopease-catalog-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-shopease_product_catalog_db}
      MYSQL_USER: ${DB_USER:-shopease_catalog_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "3310:3306"
    volumes:
      - catalog_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  catalog-api:
    build: .
    image: shopease-product-catalog-service:latest
    container_name: shopease-catalog-container
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: catalog-db
      DB_PORT: 3306
    ports:
      - "8005:8005"
    depends_on:
      catalog-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  catalog_mysql_data:
